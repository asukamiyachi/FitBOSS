# GitHub-hosted macOS checks for PRs and main. Never deploy or upload camera data.
name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref_to_test:
        description: "Optional branch, tag, or commit SHA to test"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Swift tests and macOS app build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_to_test || github.sha }}
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate Firebase JSON when present
        run: |
          for file in .firebaserc firebase.json firebase/database.rules.json firebase/firestore.indexes.json; do
            if [ -f "$file" ]; then
              python3 -m json.tool "$file" > /dev/null
            fi
          done

      - name: Run Swift unit tests
        if: hashFiles('Package.swift') != ''
        run: swift test

      - name: Build local macOS test app
        if: hashFiles('Package.swift') != ''
        run: bash Scripts/build-app.sh

  backend-contract:
    name: Firebase backend contract (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_to_test || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JS syntax and backend domain tests
        run: |
          if [ -f functions/src/index.js ]; then
            node --check functions/src/index.js
            node --check functions/src/domain.js
            node --check functions/tests/rules.test.cjs
            node --test functions/tests/domain.test.cjs
          fi
      - name: Deny accidental default Firebase deploy
        run: |
          python3 - <<'PY'
          import json
          with open('.firebaserc') as f:
              aliases = json.load(f)['projects']
          assert 'default' not in aliases
          PY

  detect-firebase-changes:
    name: Determine whether backend integration tests are needed
    runs-on: ubuntu-latest
    outputs:
      run_emulator: ${{ steps.changed.outputs.run_emulator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_emulator=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- functions firebase firebase.json .firebaserc | grep -q .; then
            echo "run_emulator=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_emulator=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase Emulator: no backend, rules or Firebase config changed."
          fi

  security-rules:
    # Keep integration coverage for backend changes without launching emulators
    # on macOS-only PRs (such as packaging and camera-only changes).
    needs: detect-firebase-changes
    if: needs.detect-firebase-changes.outputs.run_emulator == 'true'
    name: Firebase Rules and Functions integration (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator test dependencies
        run: npm install --prefix functions --no-package-lock --ignore-scripts
      - name: Run local Rules and authenticated Functions integration tests
        run: npx --yes firebase-tools@14 emulators:exec --project demo-fitboss-rules --only auth,firestore,database,functions "cd functions && npm run test:rules && npm run test:integration"

  native-firebase-compile:
    name: macOS official Firebase SDK compile (no config, no deploy)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native Firebase and Google Sign-In integration
        env:
          FITBOSS_FIREBASE_ENABLED: "1"
        run: swift build -c debug --product FitBOSSApp
