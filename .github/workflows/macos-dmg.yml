# Internal testing only. Never publish a Release from a PR or this workflow.
name: macOS internal DMG

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  internal-dmg:
    name: Build and inspect unsigned distribution test image
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Swift and tests
        run: swift test
      - name: Build camera prototype without distribution credentials
        run: bash Scripts/build-app.sh
      - name: Verify offline rebuild purges stale Firebase artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/FitBOSS.app"
          mkdir -p "$APP/Contents/Resources/StaleFirebase.bundle"
          printf 'synthetic test data only' > "$APP/Contents/Resources/GoogleService-Info.plist"
          printf 'synthetic test data only' > "$APP/Contents/embedded.provisionprofile"
          printf 'synthetic marker' > "$APP/Contents/Resources/StaleFirebase.bundle/sentinel"
          /usr/bin/python3 - "$APP/Contents/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source: info=plistlib.load(source)
          info["CFBundleURLTypes"]=[{"CFBundleURLSchemes":["fake-firebase-oauth-scheme"]}]
          with open(sys.argv[1], "wb") as target: plistlib.dump(info,target)
          PY
          # A direct DMG build must fail closed rather than package stale SDK config.
          if bash Scripts/create-dmg.sh; then
            echo "Incorrectly permitted an OAuth-configured app into internal DMG" >&2
            exit 1
          fi
          bash Scripts/build-app.sh
          test ! -e "$APP/Contents/Resources/GoogleService-Info.plist"
          test ! -e "$APP/Contents/embedded.provisionprofile"
          test ! -e "$APP/Contents/Resources/StaleFirebase.bundle"
          /usr/bin/python3 - "$APP/Contents/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source: info=plistlib.load(source)
          assert not info.get("CFBundleURLTypes"), "Stale OAuth scheme retained in offline app"
          PY
      - name: Generate drag-and-drop FitBOSS.dmg
        run: bash Scripts/create-dmg.sh
      - name: Verify mounted DMG contents
        shell: bash
        run: |
          set -euo pipefail
          MOUNT_POINT="$(mktemp -d -t fitboss-mount)"
          cleanup() {
            hdiutil detach -quiet "$MOUNT_POINT" 2>/dev/null || true
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -quiet -readonly -nobrowse \
            -mountpoint "$MOUNT_POINT" .build/dist/FitBOSS.dmg
          test -x "$MOUNT_POINT/FitBOSS.app/Contents/MacOS/FitBOSSApp"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = /Applications
          codesign --verify --deep --verbose=2 "$MOUNT_POINT/FitBOSS.app"
          test ! -e "$MOUNT_POINT/FitBOSS.app/Contents/Resources/GoogleService-Info.plist"
          test ! -e "$MOUNT_POINT/FitBOSS.app/Contents/embedded.provisionprofile"
      - name: Upload internal DMG test artifact (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: FitBOSS-internal-dmg-${{ github.run_id }}
          path: .build/dist/FitBOSS.dmg
          if-no-files-found: error
          retention-days: 7
